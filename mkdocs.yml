site_name: Cancer Data Aggregator (Minimal Preview)
site_description: Minimal build to validate Read the Docs rendering

theme:
  name: readthedocs
  highlightjs: true

plugins:
  - search
  - mkdocs-jupyter:
      execute: true
      allow_errors: false
      include_source: true
  - macros:
      module_name: main

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
      check_paths: true

extra_css:
  - css/cards.css

nav:
  - Home: index.md
  - "Home (alternate, long-form)": index_long_form.md
  - Getting Started: getting_started/index.md
  - Vignettes:
    - Conceptual Overview: documentation/cdapython/vignettes/index.md
    - "Is there anything about X?": documentation/cdapython/vignettes/01_global_search.ipynb
    - "Getting oriented before I filter": documentation/cdapython/vignettes/02_systematic_browsing.ipynb
    - "I have subjects, what else exists": documentation/cdapython/vignettes/03_match_from_file.ipynb
    - "Reassembling a scattered project": documentation/cdapython/vignettes/04_cptac_reassembly.ipynb
    - "Patients with multiple data types": documentation/cdapython/vignettes/05_multimodal_patients.ipynb
  - Prototypes:
    - prototypes/index.md
  - Helpdesk: helpdesk/index.md
  - About Us:
    - about_us/index.md
    - about_us/ourdata.md
  - Release Notes:
    - release_notes/cdapython.md
    - release_notes/data_updates.md
