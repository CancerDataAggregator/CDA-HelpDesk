site_name: Cancer Data Aggregator
site_description: Search and aggregate cancer data across multiple data commons

theme:
  name: material
  features:
    - navigation.tabs          # top-level sections become a horizontal tab bar
    - navigation.tabs.sticky   # tabs stay visible while scrolling within a section
    - navigation.sections      # left sidebar groups by section instead of one flat list
    - navigation.expand        # sections start expanded, not collapsed-by-default
    - navigation.indexes       # clicking a section title (e.g. "Vignettes") opens its index.md
                                # instead of only toggling expand/collapse
    - navigation.top           # "back to top" button
    - header.autohide          # header scrolls away going down, reappears scrolling up
    - toc.follow               # right-sidebar TOC auto-scrolls/highlights with reading position
    - search.suggest
    - search.highlight
    - content.code.copy
  # Single fixed palette, no dark/light toggle. itables' DataTables UI (search box,
  # buttons, pagination) inherits color/background from ancestors instead of setting
  # its own; Material's dark-scheme variable swap was leaking into it and rendering
  # tables black. A static palette removes that entire mechanism.
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  icon:
    repo: fontawesome/brands/github

# Material ships its own search implementation; the plugin just builds the index.
plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      include_source: true
  - macros:
      module_name: main

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.snippets:
      base_path: docs
      check_paths: true

extra_css:
  - css/cards.css

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting_started/index.md
    - Interactive Search: interactive.ipynb
    - Install locally: getting_started/install.md
    - No installation (Colab): getting_started/no_install.md
  - Vignettes:
    - Conceptual Overview: documentation/cdapython/vignettes/index.md
    - "1. Is there anything about X?": documentation/cdapython/vignettes/01_global_search.ipynb
    - "2. Getting oriented before I filter": documentation/cdapython/vignettes/02_systematic_browsing.ipynb
    - "3. I have subjects, what else exists": documentation/cdapython/vignettes/03_match_from_file.ipynb
    - "4. Reassembling a scattered project": documentation/cdapython/vignettes/04_cptac_reassambly.ipynb
    - "5. Subjects with multiple data types": documentation/cdapython/vignettes/05_multimodal_patients.ipynb
  - Function Reference:
    - "Quick Reference": documentation/cdapython/man_pages/index.ipynb
    - cda_functions(): documentation/cdapython/man_pages/cda_functions.md
    - tables(): documentation/cdapython/man_pages/tables.md
    - columns(): documentation/cdapython/man_pages/columns.md
    - column_values(): documentation/cdapython/man_pages/column_values.md
    - summarize_subjects(): documentation/cdapython/man_pages/summarize_subjects.md
    - summarize_files(): documentation/cdapython/man_pages/summarize_files.md
    - get_subject_data(): documentation/cdapython/man_pages/get_subject_data.md
    - get_file_data(): documentation/cdapython/man_pages/get_file_data.md
    - intersect_subject_results(): documentation/cdapython/man_pages/intersect_subject_results.md
    - expand_subject_results(): documentation/cdapython/man_pages/expand_subject_results.md
    - intersect_file_results(): documentation/cdapython/man_pages/intersect_file_results.md
    - expand_file_results(): documentation/cdapython/man_pages/expand_file_results.md
  - Developers:
    - API Reference: documentation/developers/index.md
  - Helpdesk: helpdesk/index.md
  - About Us:
    - about_us/index.md
    - about_us/how_we_etal.md
    - about_us/our_data.md
  - Release Notes:
    - "Code Release Notes": release_notes/cdapython.md
    - "Data Release Notes": release_notes/data_updates.md
